.hlkey{font-size:12px; color:var(--muted)}
.hlkey em.hl{cursor:default}
button.btn{

button.btn.gh{background:transparent; border-color:transparent; color:var(--muted)}
button.btn.gh:hover{background:var(--panel2); color:var(--ink)}

label.fld{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted); min-width:150px}

.sec{border-left:3px solid var(--line); padding:2px 0 2px 14px; margin:18px 0}

    "技术本身没有善恶，关键在于人如何使用它。只有各方相向而行，才能让人工智能真正造福全人类。",

  analysis:[
    "专名《全球人工智能治理倡议》官方英译 Global AI Governance Initiative，政府文件、倡议类名称首现须完整并保留引号或斜体。",

    "“帮助发展中国家提升能力建设”注意 help 后接动词原形：help developing countries enhance …；也可写成 help … in enhancing …。",

  pitfalls:[

    "“技术滥用”译 misuse of technology；“确保……处于……之下”须用 ensure that 从句，漏掉 that 易判语法错误。"

  title:"大运河文化遗产的活化利用",
  genre:"文化遗产 · 保护实践",
  seg:[
    "大运河是世界上开凿最早、规模最大的运河，2014年被列入《世界遗产名录》。它不仅是一条运输通道，更是一条流动的文化长廊，沿线城市因河而生、因河而兴。",

    "保护不是把遗产封存起来，而是在延续历史脉络的前提下，让它融入当代生活。这种活化利用的思路，为其他线性文化遗产的保护提供了有益借鉴。遗产只有被使用，才真正被记住。"

  title:"非遗传承与乡村振兴的结合",
  genre:"文化民生 · 调研报告",
  seg:[
    "非物质文化遗产大多植根于乡土社会，是乡村最鲜活的文化记忆，多由普通人的日常生活延续而来。",
    "近年来，各地探索把非遗保护与乡村振兴结合起来：有的地方通过“非遗工坊”带动村民居家就业，有的把传统技艺转化为文创产品，有的以民俗节庆吸引游客、带动民宿和农产品销售。",
    "这些实践表明，非遗保护不能停留在静态的展示和抢救上，而要建立让传承人凭手艺获得体面收入的机制。只有让技艺“活”在当代人的生产和生活中，传承才不会沦为博物馆里的标本。"

  ref:[
    "Intangible cultural heritage (ICH) is mostly rooted in rural society, and it is the most vivid cultural memory of the countryside, carried on largely through the everyday life of ordinary people.",

  analysis:[

    "“非遗工坊”可译 ICH workshops，引号保留；“居家就业”用 enable villagers to work from home，比 home-based employment 更自然。",
    "三处“有的……有的……有的……”须用 some … some … others … 平行收束，若三段全用 some 会判句式单调。",
    "“凭手艺获得体面收入”须重构：earn a decent income from their craft，把“凭”处理成 from。",
    "末句“只有……才不会……”用 Only when … will … 倒装，是冲刺档的加分句式，可显著提升语言质量分。",

    "Every weekday at half past eleven, a queue forms outside a converted shopfront on the edge of the estate. The customers are almost all over seventy; the meal costs eight yuan.",

    "Whether such schemes last is another matter. Most operate on budgets that cover part of the cost and rely on volunteers, and several have already closed after a rent rise or a change of operator. Officials describe them as one component of a wider system rather than a solution in themselves, and the phrase they use — ageing in place — makes the ambition clear. What remains unresolved is who pays for it, and how, once the novelty of a pilot project has worn off."

{
  id:"e7", theme:"region", level:"进阶",
  title:"内陆崛起与区域内的新差距",
  genre:"区域经济分析（同源文体）",
  seg:[
    "Few places illustrate the uneven geography of growth better than China's interior. In the 1990s, coastal provinces attracted the overwhelming share of foreign investment; inland cities were left to compete on cheap land and low wages.",
    "That gap has narrowed, though not disappeared. High-speed rail has cut travel times between Chengdu and the coast from two days to eight hours, and e-commerce platforms have given farmers in remote counties direct access to urban consumers. As a result, some inland capitals now rival coastal cities in retail spending.",
    "Yet the pattern is uneven within regions as well as between them: provincial capitals are pulling ahead of the smaller cities around them, drawing away graduates, capital and patients.",
    "For planners, the challenge is no longer simply to close the east-west gap, but to prevent new ones from opening up inside the interior.",
    "Not everyone welcomes the trend. Economists warn that a country can spread its capital too thin to build world-class clusters anywhere, and that the fiscal cost of connecting every small city is borne by taxpayers nationwide. Residents, by contrast, tend to measure success in more concrete terms: whether a hospital, a school and a decent job are within reach without moving. Both concerns are legitimate, and any policy that ignores either will eventually be reversed."
  ],
  ref:[
    "中国内陆地区最能说明增长在地理上的不均衡。上世纪九十年代，沿海省份吸引了绝大多数外商投资，内陆城市则只能靠廉价土地和低工资参与竞争。",
    "这一差距虽已缩小，但并未消失。高铁把成都到沿海地区的行程从两天缩短到八小时，电商平台让偏远县城的农民得以直接对接城市消费者。因此，如今一些内陆省会城市在零售消费额上已可与沿海城市比肩。",
    "然而，这种格局不仅体现在地区之间，也体现在地区内部：省会城市正把周边中小城市甩在身后，吸走了那里的毕业生、资本和患者。",
    "对规划者而言，挑战已不再只是缩小东西部差距，而是防止内陆地区内部出现新的差距。",
    "并非所有人都乐见这一趋势。经济学家警告说，一个国家可能把资本摊得太薄，以致在哪儿都建不成世界级集群；而连接每一座小城市的财政成本，最终要由全国纳税人承担。相比之下，居民衡量成功的标准更具体：不搬家能不能就近看病、上学、找到一份像样的工作。两种关切都有道理，任何忽视其中之一的政策，最终都会被推翻。"
  ],
  analysis:[
    "Few places illustrate … better than … 是“否定式最高级”，汉语译“最能说明……”，不要译成“很少地方比……更好地说明”。",
    "the overwhelming share 译“绝大多数份额”；foreign investment 在区域经济语境下宜明确为“外商投资／外商直接投资（FDI）”。",
    "compete on cheap land and low wages 中 on 表凭借，译“靠廉价土地和低工资参与竞争”，补出“参与”使汉语完整。",
    "though not disappeared 是让步省略结构，汉语须补全为“但并未消失”，否则逻辑连接词悬空。",
    "rival coastal cities in retail spending 中 rival 作动词，译“在……上可与……比肩”。",
    "pulling ahead of 是动态表达，译“把……甩在身后”，比“领先于”更有画面感，也贴合“差距扩大”的主旨。",
    "末句 not simply to … but to prevent … 用“不再只是……而是……”对举；new ones 指代 gaps，汉语须增词显化为“新的差距”，否则指代不明。",
    "“spread its capital too thin to …”是 too … to … 结构，译“把资本摊得太薄，以致无法……”；“Residents, by contrast”须译出“相比之下”，与前句经济学家形成对照。"

{
  id:"e8", theme:"diplomacy", level:"进阶",
  title:"发展融资缺口与体系改革",
  genre:"联合国式发言（仿真材料）",
  seg:[
    "As we gather this year, the financing gap for the Sustainable Development Goals stands at some four trillion dollars a year. That figure is not an abstraction; it is the schools that were not built, the vaccines that were not delivered and the grids that were never connected.",
    "Yet while developing countries are asked to do more with less, the international financial architecture still reflects the distribution of power in 1945. Reforms agreed years ago — a reallocation of quotas, a larger role for vulnerable economies — remain unfinished. Meanwhile, the countries that need capital most pay the highest price for it.",
    "My delegation therefore urges three steps: first, replenish concessional finance rather than merely reprofile existing debt; second, make the common framework for debt treatment work in practice, not only on paper; and third, ensure that any new instrument is governed by those who use it.",
    "We are not asking for charity. We are asking for a system that treats a country's ability to repay as a fact to be assessed rather than a virtue to be assumed. Until that changes, pledges will continue to outrun disbursements, and summits will continue to outnumber solutions. That is why we keep returning to this chamber."
  ],
  ref:[
    "今年我们在此相聚之际，可持续发展目标的融资缺口每年约为四万亿美元。这个数字并非抽象的符号；它意味着没能建成的学校、没能送达的疫苗，以及始终未能接入的电网。",
    "然而，在要求发展中国家以更少资源做更多事情的同时，国际金融架构仍在反映1945年的权力格局。多年前商定的改革——重新分配份额、让脆弱经济体发挥更大作用——至今仍未完成。与此同时，最需要资金的国家，却要为资金付出最高的代价。",
    "因此，中国代表团呼吁采取三步：第一，补充优惠融资，而不是仅仅对现有债务进行重组；第二，让债务处理共同框架在实践中而非纸面上运转起来；第三，确保任何新机制都由其使用者来治理。",
    "我们并非在请求施舍。我们要求的是一个把一国偿债能力视为需要评估的事实、而非可以假定的美德的体系。在这一点改变之前，承诺仍将继续跑在拨付之前，峰会也仍将多于解决方案。这正是我们一再回到这个会议厅的原因。"
  ],
  analysis:[
    "“the financing gap … stands at some four trillion dollars a year”中 some 表约数，译“约”；stands at 表“目前为”，译“约为”即可，不必译“站立在”。",
    "“That figure is not an abstraction; it is …”是分号连接的对举句，汉语保留分号，并把后半句展开为“它意味着……”，符合中文论证习惯。",
    "“do more with less”是英语习语，译“以更少资源做更多事情”，保留对比而不逐字直译。",
    "“the distribution of power in 1945”译“1945年的权力格局”，用“格局”避免与下文 quota（份额）混淆。",
    "三项并列 first / second / third 后接祈使动词，汉语转为“第一，……；第二，……；第三，……”，保持清单感与正式语域。",
    "“treats … as a fact to be assessed rather than a virtue to be assumed”是全段金句，须完整保留 fact／virtue 与 assessed／assumed 的双重对举。",
    "“pledges will outrun disbursements, and summits will outnumber solutions”用两个 out- 动词构成对仗，汉语以“承诺跑在拨付之前／峰会多于解决方案”保留节奏。"
  ],
  pitfalls:[
    "“concessional finance”是“优惠融资”，误译“让步资金”“慈善资金”均属术语错。",
    "“reprofile existing debt”译“对现有债务进行重组／展期”，不是“重新配置债务”。",
    "“the common framework for debt treatment”是专有机制名称，译“债务处理共同框架”，不可意译为“处理债务的通常办法”。",
    "“governed by those who use it”译“由其使用者（来）治理”，译成“由政府管理”属方向性错误。",
    "漏译 “not only on paper” 的对照含义，会削弱对“纸面改革”的批评力度。",
    "“charity”在此译“施舍”，误译“慈善机构”属词性误判。"

{
  id:"e9", theme:"diplomacy", level:"冲刺",
  title:"气候变化的安全维度",
  genre:"安理会式发言（仿真材料）",
  seg:[
    "Climate change is no longer a distant projection; it is a present threat with a military dimension. Drought has driven herders into conflict over grazing land; rising seas are redrawing the boundaries of island states; and in the Sahel, the shrinking of Lake Chad has been described by analysts as one of the region's most effective recruiters for armed groups.",
    "Yet the Security Council still debates climate only episodically, treating it as an environmental question that occasionally wanders into the chamber. This is a category error. When a state's territory becomes uninhabitable, sovereignty is not merely threatened — it is dissolved. When food prices spike, governments fall.",
    "What is required is not another declaration but a standing mechanism: climate risk assessments integrated into every mandate the Council issues, and a dedicated agenda item that survives the veto. Some will object that the Council is not the right forum. To them I would say: name the institution that can mobilise both finance and force, and we will go there instead.",
    "Until then, the burden of proof lies with those who prefer to wait for the next disaster to make the argument for them. My delegation stands ready to work with any member that is prepared to treat the climate not as a future problem to be managed, but as a present one to be governed."
  ],
  ref:[
    "气候变化不再是一个遥远的预测，而是一种带有军事维度的现实威胁。干旱使牧民因争夺牧场而陷入冲突；海平面上升正在改写岛国的边界；在萨赫勒地区，分析人士称乍得湖的萎缩是该地区为武装团体招募人员最有效的手段之一。",
    "然而，安理会仍然只是零星地讨论气候问题，将其视为一个偶尔闯入会议厅的环境议题。这是一种范畴错误。当一国领土变得无法居住时，主权不仅受到威胁——它已经消解。当粮价飙升时，政府就会垮台。",
    "我们需要的不是又一份宣言，而是一个常设机制：把气候风险评估纳入安理会发布的每一项授权，并设立一个不受否决权左右的专门议程项目。有人会反驳说，安理会并非合适的论坛。对此我的回答是：请指出哪一个机构既能调动资金又能调动武力，我们就改去那里。",
    "在那之前，举证责任在于那些宁可等待下一场灾难替他们说话的人。本代表团愿与任何会员国合作，只要它愿意不再把气候当作有待管理的未来问题，而是当作亟需治理的当下问题。"
  ],
  analysis:[
    "“a distant projection”译“遥远的预测”，projection 在此指基于模型的情景推演，不译“投射”。",
    "“with a military dimension”译“带有军事维度的”，作后置定语，不宜拉长为“在军事层面上的问题”。",
    "“are redrawing the boundaries”是现在进行时，译“正在改写”，体现进程性。",
    "“a category error”是哲学概念，固定译“范畴错误”，指把问题归入了错误的类别。",
    "“not merely threatened — it is dissolved”是破折号递进，汉语保留破折号；dissolved 译“消解”比“溶解”更贴政治语境。",
    "“a standing mechanism”译“常设机制”；“a dedicated agenda item that survives the veto”译“不受否决权左右的专门议程项目”，survives 不可直译“活过”。",
    "末句 not as A to be managed, but as B to be governed 的双重对举须完整保留，managed／governed 的语义差异正是本段的落脚点。"

    "“Lake Chad”固定译“乍得湖”；“the Sahel”译“萨赫勒地区”，专名不可意译。",

{
  id:"e10", theme:"trade", level:"基础",
  title:"世贸组织争端解决机制瘫痪",
  genre:"国际经贸新闻（同源文体）",
  seg:[
    "Ministers meeting in Abu Dhabi failed to agree on any substantive outcome this week, leaving the World Trade Organization without a clear mandate as its dispute settlement system remains paralysed. The failure was widely expected, but its consequences will not be felt evenly.",
    "The Appellate Body has not functioned since 2019, when the United States blocked appointments to it. In its absence, members have increasingly resorted to litigation among themselves and to unilateral tariffs, and smaller economies have found themselves with little leverage and no referee. Appeals now simply lapse, which means that a losing party can escape a ruling by filing one.",
    "The closing texts did extend a moratorium on customs duties for electronic transmissions, a modest achievement that keeps cross-border data flows free of tariffs for now. But proposals to restore binding arbitration, floated by the European Union and a group of middle-income countries, did not survive the final session.",
    "Officials insisted that the organization is “under construction, not in decline”. Traders, however, appear to be voting with their supply chains: more contracts now specify private arbitration in Singapore or Geneva rather than rely on a system that cannot deliver a ruling. That is a quiet but unmistakable verdict. Whether governments are willing to hear it is another question."

  ref:[
    "本周在阿布扎比开会的各国部长未能就任何实质性成果达成一致，这使世界贸易组织在争端解决机制持续瘫痪之际缺乏明确授权。这一失败在普遍预料之中，但它带来的后果并非人人均等承受。",
    "上诉机构自2019年起便无法运转，当时美国阻止了对该机构成员的任命。在它缺位的情况下，成员之间越来越多地诉诸相互诉讼和单边关税，而较小的经济体则发现自己既无筹码，也无人裁决。如今上诉只是自动失效，这意味着败诉方只要提出上诉，就能逃避裁决。",
    "会议闭幕文本确实延长了电子传输免征关税的暂停期，这是一项不大不小的成果，使跨境数据流动暂时仍免于关税。但由欧盟和一些中等收入国家提出的恢复有约束力的仲裁的提案，未能挺过最后一轮会议。",
    "官员们坚称该组织“正在建设之中，而非走向衰落”。然而，贸易商似乎正用供应链投票：如今越来越多的合同指定在新加坡或日内瓦进行私人仲裁，而不再依赖一个无法作出裁决的体系。这是一个安静却明白无误的裁决。各国政府是否愿意听取，则是另一个问题。"

    "“The Appellate Body”是机构专名，首字母大写，译“上诉机构”。",
    "“blocked appointments to it”译“阻止了对该机构成员的任命”，不可简化为“阻止任命”。",

  seg:[
    "Subsidies have returned to fashion, and economists are wrestling with the consequences. On one view, the case for industrial policy is straightforward: markets undersupply technologies with enormous spillovers, and only states can absorb the early risks of solar panels, batteries and semiconductors. The debate is no longer ideological; it is empirical.",

    "The alternative — a world in which every large economy subsidises the same five industries — would be expensive, inflationary and ultimately self-defeating. The task for the next decade is to distinguish the subsidies that build capacity from those that merely build constituencies. That distinction, more than any treaty, will determine whether industrial policy earns its place or squanders it."

    "另一种观点认为，补贴会被现有企业俘获，保护低效企业，并招致报复。两种批评都有证据支持，正因如此，更有用的问题不是要不要使用产业政策，而是如何设计产业政策，使其具有临时性、条件性和透明度。",
    "在实践层面，这意味着衡量结果而非意图，对失败的项目设定退出期限，并与伙伴协调，以避免补贴沦为逐底竞争。它还意味着抵制一种诱惑：把每一个战略性产业都当作国家紧急状态；因为一项不可能失败的政策，就是一项无法评估的政策。",
    "另一种前景——每个大型经济体都补贴同样五个产业的世界——代价高昂、推高通胀，最终还会自伤。未来十年的任务，是区分那些建设能力的补贴与那些仅仅培育利益集团的补贴。这一区分比任何条约都更能决定产业政策是赢得其应有位置，还是将其挥霍殆尽。"

  seg:[
    "The museum announced this week that its entire collection — some 2.3 million objects — will be photographed, catalogued and released online under a licence that permits commercial reuse. The director called it “a gift to the world”.",
    "Curators are less lyrical. Digitisation, they note, is not preservation: a photograph does not halt the chemical decay of a ninth-century manuscript, and money spent on imaging is money not spent on climate control. Nor is access neutral. When images circulate freely, the object itself may be visited by fewer people — which is good for its survival but hard on the smaller museums that depend on visitors to pay for it.",
    "The more interesting consequence is commercial. License-free images will appear on everything from tea towels to phone cases, and the museum will earn nothing from any of it. A handful of institutions have responded by releasing only low-resolution files, or by reserving the highest-quality images for licensed users.",
    "Whether that counts as generosity or as a business model nobody has thought through is, for now, a matter of interpretation. What is not in doubt is that the argument about open access has moved on: the question is no longer whether collections should be digitised, but who pays for the digitisation and who profits from it."

  ref:[
    "该博物馆本周宣布，其全部馆藏——约230万件藏品——都将被拍摄、编目并在网上发布，许可协议允许商业性再利用。馆长称之为“献给世界的礼物”。",
    "策展人则没有那么诗意。他们指出，数字化并不等于保护：一张照片并不能阻止一部九世纪手稿的化学朽坏，而花在成像上的钱，也就不是花在恒温恒湿上的钱。可及性也并非中性。当图像自由流传时，实物本身可能反而少了参观者——这对其存续是好事，却让那些依靠门票收入维持运转的较小博物馆举步维艰。",
    "更有意思的后果在商业层面。免许可的图像将出现在从茶巾到手机壳的各种商品上，而博物馆从中分文不获。少数机构的应对是只发布低分辨率文件，或把最高质量的图像留给获得许可的用户。",
    "这究竟算慷慨，还是一种谁也没想清楚的商业模式，目前还见仁见智。不容置疑的是，关于开放获取的争论已经向前推进：问题不再是馆藏该不该数字化，而是由谁为数字化付费、又由谁从中获利。"

  seg:[
    "For a decade, the city has been both a triumph and a warning. Inscribed on the World Heritage List for its perfectly preserved medieval core, it now receives twenty million visitors a year — roughly six hundred for every resident. Nobody who drafted the listing anticipated anything of the kind.",
    "Residents have adapted: bakeries have become souvenir shops, apartments have become short-term lets, and the primary school has closed for lack of children. A council survey found that three in ten households now consist of a single person over sixty. Those who can afford to leave have largely done so.",
    "Officials speak of “managed access”, by which they mean timed tickets, higher entry fees and a cap on cruise ships. These measures work, up to a point; visitor numbers fall, but only marginally, because the underlying incentives remain unchanged: heritage generates revenue, and revenue generates pressure to admit more visitors.",
    "The deeper difficulty is that conservation and tourism are financed by the same stream. Some cities have begun to experiment with visitor levies channelled directly into restoration. Until they find a way to fund the maintenance of the asset without monetising the experience of it, they will keep treating the very crowding that degrades the site as evidence of its value."

    "What replaced them arrived slowly: a research station, a guesthouse, a network of trails maintained by former loggers who now earn a season's wage for repairing paths and monitoring wildlife cameras. Rangers report that visitor numbers have risen every year since the park opened, though the increase is concentrated in three summer months.",
    "Ecologists report that the lynx has returned, and that the river, once silted, is clear enough for otters. The park's own monitoring suggests fish stocks have recovered to roughly their 1970s levels — a benchmark that took four decades of protection to reach elsewhere. The park's budget has grown by a third since it opened.",
    "Officials elsewhere are watching closely, because the model is about to be replicated: three more parks are due to be designated over the next two years. The lesson, the park's director says, is patience. Restoration takes decades; politics takes months. The trick is to design institutions that outlast both."

    "The hospital introduced an app for booking appointments, and within a year the queues outside its doors had grown longer rather than shorter. The reason soon became clear: the patients who most needed care were the least likely to own a smartphone, and those who did often struggled to navigate a system designed by people twenty years younger.",
    "A survey of similar schemes found the same pattern in four countries. Where a service is digitised without a fallback, it does not become more efficient; it becomes more selective — and the people it filters out are usually those with the greatest need and the least voice.",

  seg:[
    "Regulators have fined the company a record sum for transferring user data abroad without adequate safeguards. The fine is the largest of its kind under the regulation. The decision will be appealed, and the appeal may take years, but the direction of travel is clear: personal data is now treated as something closer to a hazardous substance than to a commodity.",
    "That analogy is useful and imperfect. It is useful because it explains why governments insist on knowing where data resides. It is imperfect because, unlike a chemical, data can be copied without loss and used by many parties at once, so restricting its movement rarely prevents harm — it merely relocates it.",
    "Companies, meanwhile, have responded rationally: they build parallel systems for each jurisdiction, at considerable cost, and pass that cost to users. Smaller firms simply withdraw from markets they cannot afford to serve, which reduces competition in precisely the services regulators hoped to protect.",
    "The likely outcome, then, is not privacy but fragmentation, in which firms serve markets with different, and not necessarily higher, standards. That is worth saying plainly, because a rule that is difficult to comply with and easy to evade is not a rule at all; it is a tax on the conscientious."
  ],
  ref:[

    "这个类比既有用，又不完美。说它有用，是因为它解释了各国政府为何坚持要知道数据存放在哪里。说它不完美，是因为与化学品不同，数据可以被无损复制，并同时被多方使用，因此限制其流动很少能防止损害——只是把损害转移了位置。",
    "与此同时，企业的应对十分理性：它们为每个司法辖区搭建并行系统，成本不菲，并把这一成本转嫁给用户。较小的公司干脆退出自己无力服务的市场，而这恰恰在监管者希望保护的领域削弱了竞争。",
    "于是，可能出现的结果不是隐私，而是碎片化：企业以不同的、且未必更高的标准服务于各个市场。这一点值得直言，因为一项难以遵守、却易于规避的规则根本算不上规则；它只是对老实人的征税。"

  seg:[
    "Few reforms are as unpopular, or as necessary, as raising the retirement age. The arithmetic is unforgiving: where four workers once supported one pensioner, the ratio is now closer to two to one, and it will keep falling.",

    "It must recognise different working lives: earlier retirement for those in physically demanding trades, later for those who choose it, and retraining that makes the choice real rather than nominal. Countries that have tried this quietly — by negotiating sector by sector rather than legislating a uniform age — have met far less resistance than those that announced a headline figure and left the details to the future.",
    "Two lessons follow. Credibility matters more than ambition: a modest change that is implemented beats a dramatic one that is deferred. And workers will accept a longer working life if, and only if, they believe the additional years will be worth living — which depends less on pension rules than on health care, housing and the quality of the jobs on offer."

  seg:[
    "For a generation entering the workforce, the promise of stable employment has quietly been withdrawn. In its place has come the platform: flexible, immediate and unforgiving. The contract was never signed; it simply ceased to be honoured.",
    "Deliveries pay by the task, so income depends on speed and availability rather than on skill or seniority; there is no paid leave, no training and no ladder. Defenders point out, correctly, that these jobs have absorbed workers whom the formal economy rejected, and that many riders value the freedom to choose their hours.",
    "Critics reply that flexibility enjoyed only by those with no alternative is not freedom but compulsion dressed in modern language. Both descriptions fit the same reality, and pretending otherwise does neither side any favours. Rather than choose sides, governments would do better to look at what the platforms measure — and at what they leave out.",
    "What is missing is a third option: portable benefits that follow the worker across platforms, minimum standards that apply regardless of contract type, and genuine routes into skilled work. Without these, the gig economy will remain what it is today — a bridge for some, and a trap for many. The choice before policymakers is not whether platforms should exist, but whether those who work through them should be treated as workers."

    "所缺的是第三种选择：可随劳动者跨平台流转的福利、不论合同类型一律适用的最低标准，以及真正通往技能型岗位的通道。没有这些，零工经济将仍然是今天的样子——对一些人来说是桥梁，对许多人来说是陷阱。决策者面临的抉择不是平台该不该存在，而是通过平台工作的人是否应被当作劳动者对待。"

{
  id:"e19", theme:"region", level:"基础",
  title:"一条高铁如何改变一座小城",

  seg:[
    "The new line cut the journey to the provincial capital from five hours to forty minutes, and almost immediately the town's expectations changed. Residents can now commute to jobs that were previously out of reach; patients can reach specialist hospitals in a morning. A journey that once required an overnight stay now fits inside a working day.",
    "But the same speed works in the other direction. Local shops report falling sales as shoppers travel to the capital for a wider choice, and the best graduates, who once might have stayed, now leave with the assurance that they can visit home easily.",
    "The pattern is familiar from a hundred cities. Whether a rail link becomes a ladder or a drain depends less on the infrastructure than on what a town does with the access it suddenly has: whether it builds housing people can afford, schools they trust, and work that uses their skills. That is a question of local policy, not of engineering.",
    "Some towns have managed this well, using the station as a hub for new housing rather than as a departure point. Others have simply become suburbs with longer platforms. Connection, in short, is an opportunity, not an outcome — and it rewards those who prepare for it in advance. The difference is usually visible within a decade."

    "但同样的速度也会向反方向起作用。随着购物者前往省城寻求更多选择，本地商铺报告销售额下滑；而过去或许会选择留下的优秀毕业生，如今带着“回家很方便”的把握离开了。",
    "这种模式在上百座城市中一再出现。一条铁路会变成阶梯还是排水渠，更多取决于这座城市如何利用突然获得的通达性，而非基础设施本身：能否建起人们负担得起的住房、他们信任的学校，以及能用上他们技能的工作。这是地方政策的问题，而不是工程问题。",
    "有些城市处理得很好，把车站当作新住房的枢纽，而不是出发地；另一些城市则只是变成了站台更长的郊区。简言之，连接是一种机会，而不是结果——它眷顾那些提前做好准备的地方。这种差别通常十年之内就能看出来。"

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
/* 高分表达标红：
   1) 数据中可用 [[…]] 显式标注重点表达；
   2) 术语库/词汇表中的目标语表达在译文中自动标红。
   用 [[…]] 优先，其余按词条长度从长到短匹配，单遍替换避免嵌套。 */
function hl(text, terms){
  const raw = String(text==null?"":text);
  const pool = (terms||[]).filter(t=>t && String(t).length>2)
    .map(t=>esc(String(t))).sort((a,b)=>b.length-a.length);
  const re = pool.length
    ? new RegExp(pool.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"), "g")
    : null;
  return raw.split(/(\[\[.+?\]\])/g).map(part=>{
    if(part.length>4 && part.slice(0,2)==="[[" && part.slice(-2)==="]]")
      return '<em class="hl">'+esc(part.slice(2,-2))+'</em>';
    const s = esc(part);
    return re ? s.replace(re, m=>'<em class="hl">'+m+'</em>') : s;
  }).join("");
}
const themeCn = id => (THEMES.find(t=>t.id===id)||{}).cn || id;
const cnChars = s => String(s||"").replace(/\s/g,"").length;
const enWords = s => (String(s||"").trim().match(/[A-Za-z'’\-]+/g)||[]).length;
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
function gradeOf(n){

  if(n>=80) return {t:"良好", c:"g-b"};

  if(n>=60) return {t:"及格", c:"g-c"};
  return {t:"不合格", c:"g-d"};
}

function fallbackCopy(txt){

function beep(times){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx=new C();
    for(let i=0;i<(times||2);i++){
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=880; g.gain.value=.12;
      o.start(ctx.currentTime+i*.42); o.stop(ctx.currentTime+i*.42+.28);
    }
    setTimeout(()=>ctx.close(), (times||2)*450+300);
  }catch(e){}
}

/* =========================================================================
   美音朗读引擎
   朗读源＝系统/浏览器提供的美式英语音色（优先 neural / Natural 音色），
   支持整篇连读、逐句精听、语速调节、断句高亮，以及加载本地真人录音。
   ========================================================================= */
let VOICES_ALL=[];
const ABBR_WORDS=/^(mr|mrs|ms|dr|prof|st|no|vs|etc|e\.g|i\.e|u\.s|u\.k|un|fig|inc|ltd)$/i;
function voiceScore(v){
  const n=((v.name||"")+" "+(v.voiceURI||""));
  const l=(v.lang||"").toLowerCase();
  let s=0;
  if(/natural|neural|online/i.test(n)) s+=100;
  if(l==="en-us") s+=50; else if(l.indexOf("en")===0) s+=30;
  if(/aria|jenny|guy|ava|andrew|emma|brian|samantha|michelle|roger|steffan|allison|serena|google us english/i.test(n)) s+=25;
  if(/premium|enhanced|siri/i.test(n)) s+=18;
  if(/zira|david|mark|hazel/i.test(n)) s+=6;
  return s;
}
function refreshVoices(){
  if(!("speechSynthesis" in window)) return;
  VOICES_ALL = speechSynthesis.getVoices()||[];
  if(!S.voice.uri){ const b=enVoiceList()[0]; if(b) S.voice.uri=b.voiceURI; }
}
function enVoiceList(){ return VOICES_ALL.filter(v=>/^en/i.test(v.lang||"")).sort((a,b)=>voiceScore(b)-voiceScore(a)); }
function zhVoiceList(){ return VOICES_ALL.filter(v=>/^zh/i.test(v.lang||"")); }
function voiceByURI(uri){ return VOICES_ALL.find(v=>v.voiceURI===uri) || enVoiceList()[0] || null; }
function voiceLabel(v){
  const tag = /natural|neural|online/i.test(v.name||"") ? "神经音色" : (/en-us/i.test(v.lang||"") ? "美音" : "英语");
  return v.name + " · " + v.lang + " · " + tag;
}
refreshVoices();
if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged = function(){ refreshVoices(); if(S.tab) render(); };
}

/* 断句：供逐句精听与高亮使用 */
function sents(t){
  const s=String(t==null?"":t).trim(); if(!s) return [];
  const out=[], enders=".!?。！？；;", closers="”\"』)]’";
  let buf="";
  for(let i=0;i<s.length;i++){
    const c=s[i]; buf+=c;
    if(enders.indexOf(c)>=0){
      const last=(buf.slice(0,-1).match(/[A-Za-z.]+$/)||[""])[0].replace(/\.$/,"");
      if(ABBR_WORDS.test(last)) continue;
      let j=i+1;
      while(j<s.length && closers.indexOf(s[j])>=0){ buf+=s[j]; j++; }
      if(j>=s.length || /\s/.test(s[j])){ out.push(buf.trim()); buf=""; i=j-1; }
    }
  }
  if(buf.trim()) out.push(buf.trim());
  return out.length?out:[s];
}
/* 渲染带断句标记的文本块，并登记朗读队列 */
function block(text, group, terms, cls){
  return sents(text).map(x=>{
    const id=S.tts.reg.length;
    S.tts.reg.push({g:group, text:x});
    return '<span class="sent" data-tts="'+id+'">'+hl(x, terms)+'</span>';
  }).join(" ");
}
function clearSpeakHl(){
  try{ document.querySelectorAll(".sent.speaking").forEach(n=>n.classList.remove("speaking")); }catch(e){}
}
function ttsStop(){
  try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){}
  S.tts.playing=false; S.tts.paused=false; S.tts.q=[]; S.tts.idx=0; clearSpeakHl(); syncAudioBtns();
}
function ttsQueue(group){
  return S.tts.reg.map((r,i)=>({g:r.g, text:r.text, i:i}))
    .filter(r=>!group || r.g===group || r.g.indexOf(group+"#")===0);
}
function ttsPlay(group, lang){
  if(!("speechSynthesis" in window)) return toast("当前浏览器不支持语音朗读");
  ttsStop();
  const items=ttsQueue(group);
  if(!items.length) return toast("没有可朗读的内容");
  S.tts.q=items; S.tts.idx=-1; S.tts.playing=true; S.tts.paused=false;
  S.tts.lang=lang||"en";
  ttsNext(); syncAudioBtns();
}
function ttsNext(){
  if(!S.tts.playing) return;
  S.tts.idx++;
  if(S.tts.idx>=S.tts.q.length){ S.tts.playing=false; clearSpeakHl(); syncAudioBtns(); return; }
  const it=S.tts.q[S.tts.idx];
  clearSpeakHl();
  const el=document.querySelector('[data-tts="'+it.i+'"]');
  if(el){ el.classList.add("speaking"); try{ el.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){} }
  speechSynthesis.speak(makeUtt(it.text, S.tts.lang));
}
function makeUtt(text, lang){
  const isZh = String(lang||"en").indexOf("zh")>=0;
  const u=new SpeechSynthesisUtterance(String(text).replace(/\s+/g," ").trim());
  u.lang = isZh ? "zh-CN" : "en-US";
  const v = isZh ? zhVoiceList()[0] : voiceByURI(S.voice.uri);
  if(v) u.voice=v;
  u.rate = Number(S.voice.rate)||1;
  u.pitch = 1; u.volume = 1;
  u.onend = function(){ ttsNext(); };
  u.onerror = function(){ S.tts.playing=false; clearSpeakHl(); syncAudioBtns(); };
  return u;
}
function ttsPause(){ try{ if("speechSynthesis" in window) speechSynthesis.pause(); S.tts.paused=true; }catch(e){} syncAudioBtns(); }
function ttsResume(){ try{ if("speechSynthesis" in window) speechSynthesis.resume(); S.tts.paused=false; }catch(e){} syncAudioBtns(); }
/* 逐句精听：每按一次读下一句 */
function ttsStep(group, lang){
  if(!("speechSynthesis" in window)) return toast("当前浏览器不支持语音朗读");
  const items=ttsQueue(group); if(!items.length) return toast("没有可朗读的内容");
  const key=group||"*";
  let i=S.tts.step[key]||0;
  if(i>=items.length) i=0;
  try{ speechSynthesis.cancel(); }catch(e){}
  S.tts.playing=false; clearSpeakHl();
  const it=items[i];
  const el=document.querySelector('[data-tts="'+it.i+'"]');
  if(el){ el.classList.add("speaking"); try{ el.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){} }
  const u=makeUtt(it.text, lang);
  u.onend=function(){ S.tts.step[key]=i+1; syncAudioBtns(); };
  speechSynthesis.speak(u);
  S.tts.step[key]=i+1;
  syncAudioBtns();
}
function syncAudioBtns(){
  try{
    document.querySelectorAll('[data-act="tts-pause"]').forEach(b=>{ b.disabled = !S.tts.playing || S.tts.paused; });
    document.querySelectorAll('[data-act="tts-resume"]').forEach(b=>{ b.disabled = !S.tts.paused; });
    document.querySelectorAll('[data-act="tts-stop"]').forEach(b=>{ b.disabled = !S.tts.playing && !S.tts.paused; });
  }catch(e){}
}
function stopSpeak(){ ttsStop(); }

/* ---------- 录音 ---------- */
async function startRec(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return toast("此环境不支持录音");
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[];
    const rec=new MediaRecorder(stream);
    rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{
      const b=new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||"audio/webm"});
      S.rec.url=URL.createObjectURL(b); S.rec.on=false;
      stream.getTracks().forEach(t=>t.stop()); render(); toast("录音结束，可回放");
    };
    window.__rec=rec; rec.start(); S.rec.on=true; render();
  }catch(e){ toast("无法访问麦克风，请检查权限设置"); }
}
function stopRec(){ try{ window.__rec && window.__rec.state!=="inactive" && window.__rec.stop(); }catch(e){ S.rec.on=false; render(); } }

/* ---------- 计时器 ---------- */
function timerSet(sec, label){
  clearInterval(S.timer.id);
  S.timer={id:null, left:sec, total:sec, label:label||""};
  renderTimer(); render();
}
function timerRun(){
  if(S.timer.id) return;
  if(S.timer.left<=0) return toast("请先选择时长");
  S.timer.id=setInterval(()=>{
    S.timer.left--;
    if(S.timer.left<=0){
      clearInterval(S.timer.id); S.timer.id=null; S.timer.left=0;
      beep(3); toast("时间到");
    }
    renderTimer();
  }, 1000);
  renderTimer(); render();
}
function timerPause(){ clearInterval(S.timer.id); S.timer.id=null; renderTimer(); render(); }
function timerReset(){ clearInterval(S.timer.id); S.timer={id:null,left:S.timer.total,total:S.timer.total,label:S.timer.label}; renderTimer(); render(); }
function fmt(sec){ sec=Math.max(0,sec|0); const m=String(Math.floor(sec/60)).padStart(2,"0"), s=String(sec%60).padStart(2,"0"); return m+":"+s; }
function renderTimer(){
  const v=$("tval"); if(!v) return;
  v.textContent=fmt(S.timer.left);
  v.classList.toggle("hot", S.timer.total>0 && S.timer.left<=Math.min(10,Math.ceil(S.timer.total*0.15)));
  const bar=$("tbar"); if(bar && S.timer.total) bar.style.width = (100 - pct(S.timer.left, S.timer.total)) + "%";
  const lab=$("tlabel"); if(lab) lab.textContent = S.timer.label || "";
}

function taskCard(t, isCN){

      ${ci?`<button class="btn sm" data-act="tts-play-seg" data-lang="${isCN?'zh':'en'}">朗读本段</button>

           <button class="btn sm" data-act="ci-ref" aria-pressed="${S.ciRef}">${S.ciRef?"隐藏逐段核对":"逐段核对译文"}</button>`
        :`<button class="btn sm" data-act="copy-src">复制原文</button>`}
    </div>

    <h3>${draftLabel}</h3>
    <textarea class="src" data-bind="draft" placeholder="在此写下你的译文。提交后进入批改台，按忠实度／表达／术语语法三维打分并逐条标注漏译、错译、中式英语与语法错误。">${esc(S.draft)}</textarea>

      ? [[45,"准备45秒"],[60,"准备60秒"],[180,"限时翻译3分钟"],[300,"冲刺限时5分钟"]]

function ciBlocks(t, isCN){
  return t.seg.map((s,i)=>{
    if(i >= S.ciShown){
      return `<div class="seg"><span class="tiny muted">第 ${i+1} 段 · 未显示（点击“下一段”放出）</span></div>`;
    }
    const live = i===S.ciShown-1;
    return `<div class="seg ${live?"live":"done"}">
      <div class="tiny muted" style="margin-bottom:6px">第 ${i+1} 段 ${live?"· 当前段":""}</div>
      <div class="${isCN?'zh-text':'en-text'}" style="margin:0">${block(s, "src#"+i, null)}</div>
      ${S.ciRef?`<hr class="n"><div class="tiny muted" style="margin-bottom:4px">参考译文 · 红色＝高分表达</div>
        <div class="${isCN?'en-text':'zh-text'}">${block(t.ref[i], "ref#"+i, t.vocab.map(v=>v[1]))}</div>`:""}
    </div>`;
  }).join("");
}

function scoreTotal(){
  const R=RUBRIC[S.grade.mode];
  let total=0, sum=0;
  R.dims.forEach((d,i)=>{
    const v = S.grade.scores[d.k]==null ? 70 : S.grade.scores[d.k];
    total += v*d.w; sum += d.w;
  });
  return {total:Math.round(total/sum), R};
}

      并强制要求逐条标注漏译、错译、逻辑缺陷、中式英语与语法错误。
      <b>分项打分的判断主体是你或你的批改人</b>；若需要逐句细读的机器批改，请用“生成 AI 批改提示词”，粘贴到任意大模型即可获得一键送分表。

function buildReport(){
  const R=RUBRIC[S.grade.mode], {total}=scoreTotal(), g=gradeOf(total);
  const lines=[];
  lines.push("【批改报告】"+R.name);
  lines.push("得分："+R.dims.map(d=>{
    const v=S.grade.scores[d.k]==null?70:S.grade.scores[d.k];
    return d.k+" "+Math.round(v*d.w/100)+"/"+d.w;
  }).join(" · "));
  lines.push("总分："+total+"/100 —— "+g.t);
  lines.push("");
  if(S.grade.src.trim()){ lines.push("【原文】"); lines.push(S.grade.src.trim()); lines.push(""); }
  lines.push("【我的译文／讲稿】"); lines.push(S.grade.draft.trim()||"（未填写）"); lines.push("");
  lines.push("【问题清单 · 逐条标注】");
  const errs=S.grade.errors.filter(e=>e.frag||e.issue||e.fix);
  if(!errs.length) lines.push("（尚未填写问题条目）");
  errs.forEach((e,i)=>{
    lines.push((i+1)+". ["+e.type+"] 片段：“"+(e.frag||"")+"”");
    lines.push("   问题："+(e.issue||""));
    lines.push("   优化："+(e.fix||""));
  });
  lines.push("");
  if(S.grade.fixed.trim()){ lines.push("【优化版译文／讲稿】"); lines.push(S.grade.fixed.trim()); }
  lines.push("");
  lines.push("—— 生成于 上海高级口译备考台 · " + new Date().toLocaleString("zh-CN"));
  return lines.join("\n");
}
function buildPrompt(){
  const isTrans = S.grade.mode==="trans";
  const R=RUBRIC[S.grade.mode];
  const errs=S.grade.errors.filter(e=>e.frag||e.issue||e.fix);
  return [
"你现在担任上海高级口译（上海外语口译证书考试 · 高级口译）阅卷与主讲教师。请严格按官方阅卷尺度批改下面这份学生作答，禁止笼统评价，必须逐条定位问题。",
"",
"【评分权重】"+(isTrans
  ? "翻译：忠实度 60%、表达流畅度 30%、术语与语法 10%（满分 100 分，档位：≥90 优秀 / 80–89 良好 / 70–79 中等 / 60–69 及格 / <60 不合格）。"
  : "口语演讲：内容完整性 40%、逻辑结构 25%、语言质量 25%、流利度 10%（满分 100 分，档位同上）。"),
"【判分附加要求】"+(isTrans
  ? "术语须优先采用高口真题通用标准译法；出现专有名词必须标注标准译法；译文风格须正式，符合口译／书面翻译规范，拒绝口语化与网络用语。"
  : "话题须为高口口试常考热点；语言须正式、有说服力；逻辑须清晰可循。"),
"",
"【输出格式要求】必须使用以下分区，缺一不可：",
"【原文】",
"【参考译文】（口语题则为【参考讲稿】）",
"【要点解析】",
"【易错扣分点】",
"【核心词汇/短语】",
"",
"【批改执行步骤】",
"1. 先给分项得分与加权总分（百分制），并给出档位；",
"2. 逐条列出问题，每条必须标明类型（漏译／错译／逻辑缺陷／中式英语／语法错误／术语误用），引用原文片段，说明问题，并给出修改后的表达；",
"3. 给出完整优化版译文（或讲稿），并说明与学员作答的关键差异；",
"4. 整理 8–12 条本篇核心词汇与固定表达（英文＋中文），专有名词标注标准译法；",
"5. 最后给出 2–3 条针对该学员的专项训练建议。",
"",
"【批改类型】"+(isTrans?"翻译（段落翻译／交传）":"口语演讲（3 分钟个人演讲）"),
"",
"【原文/题目】",
(S.grade.src.trim()||"（未填写）"),
"",
"【学生译文/讲稿】",
(S.grade.draft.trim()||"（未填写）"),
"",
"【学生自评问题清单】",
errs.length? errs.map((e,i)=>(i+1)+". ["+e.type+"] "+(e.frag||"")+" → "+(e.issue||"")+" → "+(e.fix||"")).join("\n") : "（无）",
"",
"【我（或批改人）的初判分数】"+scoreTotal().total+" 分（请复核并给出你的独立评分，如与初判不同请说明理由）"
  ].join("\n");
}

/* ---------- 术语库 ---------- */
function termsView(){
  const q=S.terms.q.trim().toLowerCase();
  const rows=TERMS.filter(t=>
    (S.terms.theme==="全部"||themeCn(t[0])===S.terms.theme) &&
    (!q || t[1].toLowerCase().includes(q) || t[2].toLowerCase().includes(q))
  );
  const opts=['<option value="全部">全部题材</option>'].concat(
    THEMES.map(t=>`<option value="${t.cn}"${S.terms.theme===t.cn?" selected":""}>${t.cn}</option>`)).join("");
  return `
  <div class="card">
    <div class="row between">
      <div><h2 style="margin:0">术语库 · 专有名词标准译法</h2>
        <div class="tiny muted">共 ${TERMS.length} 条，按高口七大高频题材归类；出现专有名词时须标注标准译法。</div></div>
      <span class="chip b">${rows.length} 条命中</span>
    </div>
    <hr class="n">
    <div class="row">
      <label class="fld" style="min-width:220px">检索<input type="text" data-bind="terms.q" value="${esc(S.terms.q)}" placeholder="输入中文或英文关键词"></label>
      <label class="fld">题材<select data-bind="terms.theme">${opts}</select></label>
      <button class="btn sm" data-act="terms-copy">复制当前结果</button>
    </div>
  </div>
  <div class="card">
    <table class="terms">
      <thead><tr><th style="width:12%">题材</th><th style="width:26%">中文</th><th style="width:34%">标准译法</th><th>备注 / 易错点</th></tr></thead>
      <tbody>
      ${rows.map(t=>`<tr>
        <td class="tiny muted">${esc(themeCn(t[0]))}</td>
        <td>${esc(t[1])}</td>
        <td class="en">${esc(t[2])}</td>
        <td class="tiny muted">${esc(t[3]||"")}</td>
      </tr>`).join("") || `<tr><td colspan="4" class="empty">没有匹配的术语</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

/* ---------- 复盘本 ---------- */
function reviewView(){
  const book=loadBook();
  const cnt={};
  book.forEach(b=>(b.errs||[]).forEach(e=>{ cnt[e.type]=(cnt[e.type]||0)+1; }));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const avg=book.length?Math.round(book.reduce((a,b)=>a+(b.total||0),0)/book.length):0;
  return `
  <div class="card">
    <div class="row between">
      <div><h2 style="margin:0">复盘本 · 错题与背诵清单</h2>
        <div class="tiny muted">数据保存在本机浏览器（localStorage），不上传任何内容。</div></div>
      <div class="row">
        <button class="btn" data-act="book-export">导出全部（.txt）</button>
        <button class="btn gh" data-act="book-clear">清空</button>
      </div>
    </div>
    <hr class="n">
    <div class="row">
      <span class="chip b">练习 ${book.length} 次</span>
      <span class="chip o">平均 ${avg} 分</span>
      ${top.map(t=>`<span class="chip r">高频问题：${esc(t[0])} × ${t[1]}</span>`).join("")||`<span class="chip">暂无问题记录</span>`}
    </div>
  </div>
  ${book.length? book.slice().reverse().map((b,i)=>`
    <div class="card">
      <div class="row between">
        <div class="row">
          <span class="chip">${esc(b.module)}</span>
          <span class="score-big" style="font-size:22px">${b.total}</span>
          <span class="grade ${gradeOf(b.total).c}">${gradeOf(b.total).t}</span>
        </div>
        <span class="tiny muted">${esc(b.ts)}</span>
      </div>
      <div class="small" style="margin:10px 0 6px;color:var(--ink)"><b>原文／题目：</b>${esc((b.src||"").slice(0,160))}${(b.src||"").length>160?"…":""}</div>
      <div class="small muted"><b>问题：</b>${(b.errs||[]).map(e=>esc(e.type)).join("、")||"无"}</div>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" data-act="book-open" data-i="${book.length-1-i}">查看全文</button>
        <button class="btn sm" data-act="book-recall" data-i="${book.length-1-i}">生成背诵清单</button>
        <button class="btn sm gh" data-act="book-del" data-i="${book.length-1-i}">删除</button>
      </div>
    </div>`).join("") : `<div class="card"><div class="empty">复盘本还是空的。在批改台完成一次批改并“保存到复盘本”，这里会累积你的错误类型分布与背诵清单。</div></div>`}`;
}
function recallList(b){
  const types={};
  (b.errs||[]).forEach(e=>{ (types[e.type]=types[e.type]||[]).push(e); });
  const out=["【背诵清单】"+b.module+" · "+b.ts,""];
  Object.entries(types).forEach(([k,v])=>{
    out.push("■ "+k+"（"+v.length+" 条）");
    v.forEach(e=>out.push("  · 片段："+(e.frag||"")+"｜问题："+(e.issue||"")+"｜订正："+(e.fix||"")));
    out.push("");
  });
  out.push("■ 优化版（背这一段，而不是背单个词）");
  out.push(b.fixed||"（未填写优化版，请回到批改台补写）");
  return out.join("\n");
}

/* ---------- 渲染 ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>
    b.setAttribute("aria-selected", String(b.dataset.tab===S.tab)));
  S.tts.reg=[];
  const v=$("view");
  if(S.tab==="cn2en") v.innerHTML=transView("cn2en");
  else if(S.tab==="en2cn") v.innerHTML=transView("en2cn");
  else if(S.tab==="speak") v.innerHTML=spView();
  else if(S.tab==="grade") v.innerHTML=gradeView();
  else if(S.tab==="terms") v.innerHTML=termsView();
  else v.innerHTML=reviewView();
  renderTimer();
}

/* ---------- 事件 ---------- */
$("tabs").addEventListener("click", e=>{
  const b=e.target.closest("button[data-tab]"); if(!b) return;
  S.tab=b.dataset.tab;
  try{ history.replaceState(null,"","#"+S.tab); }catch(err){ location.hash=S.tab; }
  window.scrollTo({top:0,behavior:"smooth"}); render();
});
$("view").addEventListener("input", e=>{
  const n=e.target;
  if(n.dataset.bind){ setPath(n.dataset.bind, n.value); return; }
  if(n.dataset.err!=null){ S.grade.errors[+n.dataset.err][n.dataset.f]=n.value; return; }
  if(n.dataset.score){
    S.grade.scores[n.dataset.score]=+n.value;
    const sv=document.querySelector('[data-sv="'+n.dataset.score+'"]'); if(sv) sv.textContent=n.value;
    const {total}=scoreTotal(), g=gradeOf(total);
    const t=$("g-total"), gg=$("g-grade");
    if(t) t.textContent=total;
    if(gg){ gg.textContent=g.t; gg.className="grade "+g.c; }
  }
});
$("view").addEventListener("change", e=>{
  const n=e.target;
  if(n.dataset.bind){
    setPath(n.dataset.bind, n.value);
    if(n.dataset.bind==="grade.mode"){ S.grade.scores={}; S.grade.result=""; }
    syncFromDOM(); render();
  }
});
$("view").addEventListener("click", async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, which=b.dataset.which;
  const isCN = which==="cn2en";
  const list = isCN?CN2EN:EN2CN;
  const t=S.task;
  switch(a){
    case "gen": syncFromDOM(); pickTask(list, t); toast("已生成新题目："+(S.task?S.task.title:"")); break;
    case "ci":
      if(!t) return toast("请先点击①出题");
      S.mode = S.mode==="ci" ? "task" : "ci"; S.ciShown=Math.max(1,S.ciShown); render(); break;
    case "ci-next": S.ciShown=Math.min(t.seg.length, S.ciShown+1); render(); break;
    case "ci-prev": S.ciShown=Math.max(1, S.ciShown-1); render(); break;
    case "ci-all": S.ciShown=t.seg.length; render(); break;
    case "ci-ref": S.ciRef=!S.ciRef; render(); break;
    case "speak-all": syncFromDOM(); speak(t.seg.join(" "), isCN?"zh":"en"); break;
    case "speak-seg": syncFromDOM(); speak(t.seg[Math.max(0,S.ciShown-1)], isCN?"zh":"en"); break;
    case "speak-stop": stopSpeak(); break;
    case "copy-src": copyText(t.seg.join("\n")); break;
    case "anal":
      S.reveal.anal=!S.reveal.anal; if(S.reveal.anal) S.reveal.ref=true; render(); break;
    case "vocab": S.reveal.vocab=!S.reveal.vocab; render(); break;
    case "reveal-ref": {
      const on=!(S.reveal.ref&&S.reveal.anal&&S.reveal.vocab);
      S.reveal={ref:on,anal:on,vocab:on}; render(); break;
    }
    case "review":
      if(!loadBook().length) return toast("复盘本为空：先在批改台保存一次批改结果");
      S.tab="review"; render(); break;
    case "save-vocab": {
      const txt=t.vocab.map(v=>v[0]+" — "+v[1]).join("\n");
      const bk=loadBook();
      bk.push({ts:new Date().toLocaleString("zh-CN"), module:"背诵清单 · "+t.title, total:100,
        src:t.title, errs:[{type:"词汇背诵",frag:"",issue:"",fix:txt}], fixed:txt,
        report:"【背诵清单】"+t.title+"\n"+txt});
      saveBook(bk); toast("词汇已存入复盘本"); break;
    }
    case "copy-vocab": {
      copyText("【核心词汇/短语】"+t.title+"\n"+t.vocab.map(v=>v[0]+" — "+v[1]).join("\n")); break;
    }
    case "grade":
      if(!t) return toast("请先点击①出题生成一道题目");
      syncFromDOM();
      S.grade.mode="trans"; S.grade.src=t.seg.join("\n"); S.grade.draft=S.draft;
      S.tab="grade"; window.scrollTo({top:0,behavior:"smooth"}); render();
      toast("已带入原文与译文，请打分并逐条标注"); break;
    /* 口语 */
    case "sp-draw": case "sp-another": {
      const p=speakPool();
      if(!p.length) return toast("该题材下暂无话题，请选择“全部题材”");
      S.sp.topic=p.length===1?p[0]:p.filter(x=>x!==S.sp.topic)[Math.floor(Math.random()*(p.length-1))];
      S.sp.show="none"; S.sp.batch=null; render(); break;
    }
    case "sp-outline": S.sp.show = S.sp.show==="outline"?"none":"outline"; render(); break;
    case "sp-model": S.sp.show = S.sp.show==="model"?"none":"model"; render(); break;
    case "sp-follow": S.sp.show = S.sp.show==="follow"?"none":"follow"; render(); break;
    case "speak-topic": speak(S.sp.topic.topicEn,"en"); break;
    case "speak-model": speak(S.sp.topic.model.join(" "),"en"); break;
    case "copy-model": copyText(S.sp.topic.model.join("\n\n")); break;
    case "sp-grade":
      syncFromDOM();
      S.grade.mode="speak"; S.grade.src=S.sp.topic.topicEn; S.grade.draft=S.sp.answer;
      S.tab="grade"; window.scrollTo({top:0,behavior:"smooth"}); render();
      toast("已带入话题与讲稿，按口语四维打分"); break;
    case "sp-batch": case "sp-batch-again": {
      const p=speakPool().slice();
      const out=[]; while(out.length<5 && p.length){ out.push(p.splice(Math.floor(Math.random()*p.length),1)[0].id); }
      while(out.length<5){ const x=SPEAKING[Math.floor(Math.random()*SPEAKING.length)]; if(!out.includes(x.id)) out.push(x.id); }
      S.sp.batch=out; S.sp.topic=null; render(); break;
    }
    case "copy-batch":
      copyText(S.sp.batch.map((id,i)=>{const x=SPEAKING.find(y=>y.id===id);
        return (i+1)+". "+x.topicEn+"\n   "+x.topicZh+"\n   提纲：\n"+x.outline.map(o=>"   - "+o).join("\n");}).join("\n\n")); break;
    /* 批改台 */
    case "err-add": syncFromDOM(); S.grade.errors.push({type:ERR_TYPES[S.grade.mode][0],frag:"",issue:"",fix:""}); render(); break;
    case "err-del": syncFromDOM(); S.grade.errors.splice(+b.dataset.i,1);
      if(!S.grade.errors.length) S.grade.errors.push({type:ERR_TYPES[S.grade.mode][0],frag:"",issue:"",fix:""}); render(); break;
    case "gen-report": syncFromDOM(); S.grade.result=buildReport(); render(); toast("报告已生成"); break;
    case "gen-prompt": syncFromDOM(); S.grade.result=buildPrompt(); render(); toast("提示词已生成，可复制到任意大模型批改"); break;
    case "copy-report": syncFromDOM();
      copyText($("g-out").value || S.grade.result || ""); break;
    case "print": window.print(); break;
    case "save-report": {
      syncFromDOM();
      if(!S.grade.draft.trim()) return toast("请先填写你的译文／讲稿");
      const {total}=scoreTotal();
      const bk=loadBook();
      bk.push({ts:new Date().toLocaleString("zh-CN"),
        module:RUBRIC[S.grade.mode].name, total, src:S.grade.src, draft:S.grade.draft,
        errs:S.grade.errors.filter(x=>x.frag||x.issue||x.fix).map(x=>({type:x.type,frag:x.frag,issue:x.issue,fix:x.fix})),
        fixed:S.grade.fixed, report:buildReport()});
      saveBook(bk); toast("已保存到复盘本（共 "+bk.length+" 条）"); break;
    }
    /* 术语 */
    case "terms-copy": {
      const q=S.terms.q.trim().toLowerCase();
      const rows=TERMS.filter(x=>(S.terms.theme==="全部"||themeCn(x[0])===S.terms.theme)&&
        (!q||x[1].toLowerCase().includes(q)||x[2].toLowerCase().includes(q)));
      copyText(rows.map(x=>x[1]+" — "+x[2]).join("\n")); break;
    }
    /* 复盘本 */
    case "book-del": { const bk=loadBook(); bk.splice(+b.dataset.i,1); saveBook(bk); render(); break; }
    case "book-clear": if(confirm("确定清空复盘本？此操作不可撤销。")){ saveBook([]); render(); } break;
    case "book-open": {
      const bk=loadBook(), it=bk[+b.dataset.i]; if(!it) return;
      S.grade.mode = it.module.indexOf("口语")>=0?"speak":"trans";
      S.grade.src=it.src||""; S.grade.draft=it.draft||""; S.grade.fixed=it.fixed||"";
      S.grade.errors=(it.errs&&it.errs.length)?it.errs:[{type:"漏译",frag:"",issue:"",fix:""}];
      S.grade.result=it.report||""; S.tab="grade"; render(); break;
    }
    case "book-recall": {
      const bk=loadBook(), it=bk[+b.dataset.i]; if(!it) return;
      S.grade.result=recallList(it); S.tab="grade"; render();
      toast("背诵清单已生成到输出框"); break;
    }
    case "book-export": {
      const bk=loadBook();
      if(!bk.length) return toast("复盘本为空");
      const txt=bk.map(b=>"════════════════════\n"+b.report).join("\n\n");
      const blob=new Blob([txt],{type:"text/plain;charset=utf-8"});
      const url=URL.createObjectURL(blob), a=document.createElement("a");
      a.href=url; a.download="高口复盘本_"+new Date().toISOString().slice(0,10)+".txt";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 3000); break;
    }
    /* 计时 */
    case "t-set": timerSet(+b.dataset.sec, b.dataset.lab); toast("已设定："+b.dataset.lab); break;
    case "t-run": timerRun(); break;
    case "t-pause": timerPause(); break;
    case "t-reset": timerReset(); break;
    /* 录音 */
    case "rec-start": startRec(); break;
    case "rec-stop": stopRec(); break;
  }
});

/* ---------- 启动 ---------- */
const TAB_IDS = ["cn2en","en2cn","speak","grade","terms","review"];
function tabFromHash(){
  const t=(location.hash||"").replace(/^#/,"");
  return TAB_IDS.indexOf(t)>=0 ? t : null;
}
const startTab = tabFromHash();
if(startTab) S.tab = startTab;
window.addEventListener("hashchange", ()=>{
  const t=tabFromHash();
  if(t && t!==S.tab){ S.tab=t; render(); }
});
render();
</script>
